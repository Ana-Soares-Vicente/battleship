apiVersion: apps/v1
kind: Deployment
metadata:
  name: battleship-api
  namespace: battleship
spec:
  replicas: 2
  selector:
    matchLabels:
      app: battleship-api
  template:
    metadata:
      labels:
        app: battleship-api
    spec:
      containers:
        - name: battleship-api
          image: battleship-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/battleship"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_DRIVER
              value: "org.postgresql.Driver"
            - name: JPA_DDL_AUTO
              value: "update"
            - name: JPA_DIALECT
              value: "org.hibernate.dialect.PostgreSQLDialect"
            - name: H2_CONSOLE_ENABLED
              value: "false"
            - name: JWT_SECRET
              value: "k8s-battleship-secret-key-change-in-production"
            - name: SPRING_REDIS_HOST
              value: "redis"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4318/v1/traces"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
