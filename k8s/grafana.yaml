apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: battleship
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: battleship
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-battleship
  namespace: battleship
data:
  battleship.json: |
    {
      "annotations": { "list": [] },
      "title": "Battleship API",
      "uid": "battleship-api",
      "panels": [
        {
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "rate(http_server_requests_seconds_count{application=\"battleship-api\"}[1m])", "legendFormat": "{{method}} {{uri}} {{status}}" }]
        },
        {
          "title": "Response Time p95 (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{application=\"battleship-api\"}[1m])) * 1000", "legendFormat": "{{method}} {{uri}}" }]
        },
        {
          "title": "JVM Memory Used",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{ "expr": "jvm_memory_used_bytes{application=\"battleship-api\"}", "legendFormat": "{{area}} - {{id}}" }]
        },
        {
          "title": "Active HTTP Connections",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{ "expr": "tomcat_connections_current_connections{application=\"battleship-api\"}", "legendFormat": "connections" }]
        },
        {
          "title": "DB Connection Pool",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            { "expr": "hikaricp_connections_active{application=\"battleship-api\"}", "legendFormat": "active" },
            { "expr": "hikaricp_connections_idle{application=\"battleship-api\"}", "legendFormat": "idle" },
            { "expr": "hikaricp_connections_pending{application=\"battleship-api\"}", "legendFormat": "pending" }
          ]
        },
        {
          "title": "Slow Requests (>1s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [{ "expr": "rate(http_server_requests_seconds_count{application=\"battleship-api\", status!~\"3..\"}[1m]) - rate(http_server_requests_seconds_bucket{application=\"battleship-api\", le=\"1.0\"}[1m])", "legendFormat": "{{method}} {{uri}}" }]
        }
      ],
      "schemaVersion": 39,
      "timezone": "browser",
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: battleship
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-battleship
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-battleship
          configMap:
            name: grafana-dashboard-battleship
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: battleship
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
