org.springframework.boot.opentelemetry.autoconfigure.OpenTelemetrySdkAutoConfiguration=
org.springframework.boot.opentelemetry.autoconfigure.OpenTelemetrySdkAutoConfiguration.ConditionalOnClass=io.opentelemetry.api.OpenTelemetry,io.opentelemetry.sdk.OpenTelemetrySdk
org.springframework.boot.opentelemetry.autoconfigure.logging.OpenTelemetryLoggingAutoConfiguration=
org.springframework.boot.opentelemetry.autoconfigure.logging.OpenTelemetryLoggingAutoConfiguration.AutoConfigureAfter=org.springframework.boot.opentelemetry.autoconfigure.OpenTelemetrySdkAutoConfiguration
org.springframework.boot.opentelemetry.autoconfigure.logging.OpenTelemetryLoggingAutoConfiguration.ConditionalOnClass=io.opentelemetry.sdk.logs.SdkLoggerProvider
org.springframework.boot.opentelemetry.autoconfigure.logging.otlp.OtlpLoggingAutoConfiguration=
org.springframework.boot.opentelemetry.autoconfigure.logging.otlp.OtlpLoggingAutoConfiguration.ConditionalOnClass=io.opentelemetry.api.OpenTelemetry,io.opentelemetry.sdk.logs.SdkLoggerProvider
org.springframework.boot.opentelemetry.autoconfigure.logging.otlp.OtlpLoggingConfigurations$Exporters=
org.springframework.boot.opentelemetry.autoconfigure.logging.otlp.OtlpLoggingConfigurations$Exporters.ConditionalOnBean=org.springframework.boot.opentelemetry.autoconfigure.logging.otlp.OtlpLoggingConnectionDetails
org.springframework.boot.opentelemetry.autoconfigure.logging.otlp.OtlpLoggingConfigurations$Exporters.ConditionalOnClass=io.opentelemetry.exporter.otlp.http.logs.OtlpHttpLogRecordExporter
